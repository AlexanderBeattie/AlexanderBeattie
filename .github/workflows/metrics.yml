name: Metrics

on:
  schedule:
    - cron: "17 3 * * *" # daily at 03:17 UTC
  workflow_dispatch: # lets you run it manually from the Actions tab
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    steps:
      - uses: lowlighter/metrics@latest
        with:
          filename: github-metrics.svg
          token: ${{ secrets.METRICS_TOKEN }}
          committer_token: ${{ secrets.GITHUB_TOKEN }}
          user: AlexanderBeattie
          config_timezone: Europe/London
          config_display: large

          # Header + activity + community stats (the card in the example)
          base: header, activity, community, repositories, metadata
          repositories_affiliations: owner

          # 3D contribution calendar, full year
          plugin_isocalendar: yes
          plugin_isocalendar_duration: full-year

          # Most-used languages (includes private repos if the token has the repo scope)
          plugin_languages: yes
          plugin_languages_limit: 8
          plugin_languages_details: percentage
          # Optional: hide languages you don't want leading the card, e.g. the Roblox game
          # plugin_languages_ignored: luau, lua

          config_order: base.header, isocalendar, base.activity, base.community, languages, base.repositories, base.metadata
